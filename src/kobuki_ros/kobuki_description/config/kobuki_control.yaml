/**/controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

#####################################################################################################################################################################
#                                                                                                                                                                   #
#                                                            DIFFERENTIAL DRIVE CONTROLLER FOR THE WHEELS                                                           #
#                                                                                                                                                                   #
#####################################################################################################################################################################

/**/diff_drive_base_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.230
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.035

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint #base_link # base_footprint
    # pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    # twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.25
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0

#####################################################################################################################################################################
#                                                                                                                                                                   #
#                                                          TRAJECTORY DRIVE CONTROLLER FOR THE D1's JOINTS                                                          #
#                                                                                                                                                                   #
#####################################################################################################################################################################

/**/d1_trajectory_controller:
  ros__parameters:
    type: "joint_trajectory_controller/JointTrajectoryController"
    joints:
      - D1_joint_1
      - D1_joint_2
      - D1_joint_3
      - D1_joint_4
      - D1_joint_5
      - D1_joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    interpolate_from_desired_state: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      D1_joint_1:
        trajectory: 0.05
        goal: 0.02
      D1_joint_2:
        trajectory: 0.05
        goal: 0.02
      D1_joint_3:
        trajectory: 0.05
        goal: 0.02
      D1_joint_4:
        trajectory: 0.05
        goal: 0.02
      D1_joint_5:
        trajectory: 0.05
        goal: 0.02
      D1_joint_6:
        trajectory: 0.05
        goal: 0.02